<script>
(function (root) {
  'use strict';
  const LIMIT = 24; // Number of half-hour steps in either direction.
  const X_DOMAIN = Object.freeze([0, 36]);
  const clampSteps = value => Math.max(-LIMIT, Math.min(LIMIT, Math.round(value)));
  const shiftedTime = (time, steps) => time + steps / 2;
  const displacement = steps => {
    const minutes = Math.abs(steps) * 30;
    return steps === 0 ? '0 min' : `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')} h ${steps < 0 ? 'früher' : 'später'}`;
  };
  const timeText = value => {
    const minutes = Math.round(Math.abs(value) * 60);
    return `${value < 0 ? '−' : ''}${Math.floor(minutes / 60)}:${String(minutes % 60).padStart(2, '0')}`;
  };
  function domain() {
    return [...X_DOMAIN];
  }
  function csvText(data, shifts) {
    const quote = s => '"' + String(s).replace(/"/g, '""') + '"';
    const rows = [['hormone','unit','original_time_h','shift_minutes','shifted_time_h','mean','sem','n'].join(',')];
    data.series.forEach(s => s.points.forEach(p => rows.push([quote(s.label),quote(s.unit),p.time,(shifts[s.id] || 0)*30,shiftedTime(p.time,shifts[s.id] || 0),p.mean,p.sem ?? '',p.n ?? ''].join(','))));
    return rows.join('\r\n') + '\r\n';
  }
  const api = { clampSteps, shiftedTime, displacement, timeText, domain, csvText, limitSteps:LIMIT };

      panel.setAttribute('aria-label',s.label + ': mittlere Konzentration');
      panel.innerHTML = `<div class="panel-top"><h2 class="panel-title"><strong>${String.fromCharCode(65+i)}</strong>${escape(s.label)}<span class="panel-unit">${escape(s.unit)}</span></h2><div class="curve-controls" role="group" aria-label="${escape(s.label)} verschieben"><button type="button" data-target="${escape(s.id)}" data-step="-1" aria-label="${escape(s.label)} 30 Minuten früher" title="30 Minuten früher">←</button><output class="curve-shift" id="shift-${escape(s.id)}">0 min</output><button type="button" data-target="${escape(s.id)}" data-step="1" aria-label="${escape(s.label)} 30 Minuten später" title="30 Minuten später">→</button></div></div><div class="chart-holder"></div><p class="chart-readout"></p>`;
      const svg = el('svg',{class:'hormone-chart',role:'img',tabindex:'0','aria-label':`${s.label}: mittlere Konzentration im Zeitverlauf. Mit den Pfeiltasten einzelne Messpunkte auswählen.`});
      panel.querySelector('.chart-holder').appendChild(svg);
      container.querySelector('#hormone-panels').appendChild(panel);
      panels.set(s.id,{panel,svg,series:s,index:i,selected:null});
    });
    function niceMaximum(value) {
      if (!(value > 0)) return 1;
      const scale = Math.pow(10,Math.floor(Math.log10(value)));
      return Math.ceil(value / scale * 2) / 2 * scale;
    }
    function draw(entry, width, height=272) {
      const s=entry.series, step=shifts[s.id], svg=entry.svg;
      svg.replaceChildren();
      svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      const axisLabel=entry.index===data.series.length-1 ? data.study.timeLabel : '';
      const maxCharacters=Math.max(24,Math.floor((width-28)/8.6));
      const axisLines=[];
      axisLabel.split(' ').filter(Boolean).forEach(word=>{
        if(!axisLines.length || axisLines[axisLines.length-1].length+word.length+1>maxCharacters)axisLines.push(word);
        else axisLines[axisLines.length-1]+=' '+word;
      });
      const axisGap=12;
      const margin={left:64+axisGap,right:22,top:20,bottom:(axisLines.length ? 55+21*(axisLines.length-1) : 40)+axisGap};
      const left=margin.left,right=width-margin.right,top=margin.top,bottom=height-margin.bottom;
      const axisX=left-axisGap, axisY=bottom+axisGap;
      const [lo,hi]=domain(data.series,shifts);
      const ymax=niceMaximum(Math.max(...s.points.map(p=>p.mean))*1.06);
      const x=t=>left+(t-lo)/(hi-lo)*(right-left), y=v=>bottom-v/ymax*(bottom-top);
      svg.appendChild(el('rect',{width,height,fill:'#fdf6e3'}));
      const clipId=`plot-window-${s.id}`;
      const defs=el('defs');
      const clip=el('clipPath',{id:clipId});
      clip.appendChild(el('rect',{x:left,y:top,width:right-left,height:bottom-top}));
      defs.appendChild(clip);svg.appendChild(defs);
      const group=el('g',{'font-family':'Arial, Helvetica, sans-serif',fill:'#073642','font-size':17}); svg.appendChild(group);
      const grid=el('g',{class:'chart-grid','aria-hidden':'true'});group.appendChild(grid);
      const axes=el('g',{class:'chart-axes','aria-hidden':'true'});group.appendChild(axes);
      axes.appendChild(el('line',{class:'y-axis',x1:axisX,x2:axisX,y1:top,y2:bottom,stroke:'#657b83','stroke-width':1.5}));
      axes.appendChild(el('line',{class:'x-axis',x1:left,x2:right,y1:axisY,y2:axisY,stroke:'#657b83','stroke-width':1.5}));
      for (let i=0;i<=4;i++) {
        const value=ymax*i/4;
        grid.appendChild(el('line',{x1:left,x2:right,y1:y(value),y2:y(value),stroke:'#ded9c9','stroke-width':1}));
        axes.appendChild(el('line',{x1:axisX-4,x2:axisX,y1:y(value),y2:y(value),stroke:'#657b83','stroke-width':1.5}));
        axes.appendChild(el('text',{class:'y-tick',x:axisX-10,y:y(value)+5,'text-anchor':'end',fill:'#586e75'},nfmt(value)));
      }
      const candidates=[.5,1,2,3,4,6,8,12,24,48];
      const tickStep=candidates.find(v=>(hi-lo)/v<=Math.max(3,Math.floor((right-left)/88))) || 48;
      for(let t=Math.ceil(lo/tickStep)*tickStep;t<=hi+1e-8;t+=tickStep){
        grid.appendChild(el('line',{x1:x(t),x2:x(t),y1:top,y2:bottom,stroke:'#eee8d5','stroke-width':1}));
        axes.appendChild(el('line',{x1:x(t),x2:x(t),y1:axisY,y2:axisY+4,stroke:'#657b83','stroke-width':1.5}));
        axes.appendChild(el('text',{class:'x-tick',x:x(t),y:axisY+25,'text-anchor':'middle',fill:'#586e75'},nfmt(t)));
      }
      axisLines.forEach((line,i)=>axes.appendChild(el('text',{class:'x-axis-label',x:width/2,y:height-9-21*(axisLines.length-1-i),'text-anchor':'middle',fill:'#586e75','font-size':17},line)));
      const curves=el('g',{'clip-path':`url(#${clipId})`});group.appendChild(curves);
      const path=(points,shift=0)=>points.map((p,i)=>`${i?'L':'M'}${x(p.time+shift).toFixed(2)},${y(p.mean).toFixed(2)}`).join(' ');
      if(step!==0) curves.appendChild(el('path',{d:path(s.points),fill:'none',stroke:'#839496','stroke-width':2.5,'stroke-dasharray':'6 5','stroke-linejoin':'round'}));
      curves.appendChild(el('path',{d:path(s.points,step/2),fill:'none',stroke:s.color,'stroke-width':4.5,'stroke-linejoin':'round','stroke-linecap':'round'}));
      s.points.forEach(p=>curves.appendChild(el('circle',{cx:x(shiftedTime(p.time,step)),cy:y(p.mean),r:3.1,fill:s.color})));
      {
        const visibleIndices=s.points.map((p,i)=>({time:shiftedTime(p.time,step),index:i}))
          .filter(p=>p.time>=lo && p.time<=hi).map(p=>p.index);
        const cursor=el('g',{visibility:'hidden','aria-hidden':'true'});
        const vline=el('line',{y1:top,y2:bottom,stroke:'#657b83','stroke-width':1,'stroke-dasharray':'3 3'});
        const dot=el('circle',{r:5,fill:s.color,stroke:'#fff','stroke-width':2});cursor.append(vline,dot);curves.appendChild(cursor);
        entry.showIndex=index=>{
          entry.selected=Math.max(visibleIndices[0],Math.min(visibleIndices[visibleIndices.length-1],index));
          const p=s.points[entry.selected],tx=shiftedTime(p.time,step);
          cursor.setAttribute('visibility','visible'); vline.setAttribute('x1',x(tx)); vline.setAttribute('x2',x(tx));dot.setAttribute('cx',x(tx));dot.setAttribute('cy',y(p.mean));
          entry.panel.querySelector('.chart-readout').textContent=`${nfmt(tx)} h · ${nfmt(p.mean)} ${s.unit} · n = ${p.n}`;
        };
        svg.onpointermove=event=>{
          const box=svg.getBoundingClientRect(), px=(event.clientX-box.left)/box.width*width;
          let nearest=0,distance=Infinity;
          visibleIndices.forEach(i=>{const d=Math.abs(x(shiftedTime(s.points[i].time,step))-px);if(d<distance){nearest=i;distance=d;}});entry.showIndex(nearest);
        };
        svg.onkeydown=event=>{
          if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();entry.showIndex((entry.selected ?? -1)+(event.key==='ArrowRight'?1:-1));}
          if(event.key==='Home'){event.preventDefault();entry.showIndex(0);}
          if(event.key==='End'){event.preventDefault();entry.showIndex(s.points.length-1);}
        };
        svg.onfocus=()=>entry.showIndex(entry.selected ?? 0);
        if(entry.selected!==null)entry.showIndex(entry.selected);
      }
      return svg;
    }
    function render(announce=false){
      panels.forEach(entry=>draw(entry,Math.max(280,entry.panel.clientWidth)));
      data.series.forEach(s=>document.getElementById(`shift-${s.id}`).textContent=displacement(shifts[s.id]));
      container.querySelectorAll('button[data-step]').forEach(button=>{
        const ids=button.dataset.target==='both'?data.series.map(s=>s.id):[button.dataset.target];
        const delta=Number(button.dataset.step);
        button.disabled=ids.some(id=>shifts[id]+delta>LIMIT || shifts[id]+delta<-LIMIT);
      });
      container.querySelector('#reset-shifts').disabled=Object.values(shifts).every(s=>s===0);
      container.classList.toggle('has-shift',Object.values(shifts).some(s=>s!==0));
      if(announce)container.querySelector('#shift-announcement').textContent=data.series.map(s=>`${s.label}: ${displacement(shifts[s.id])}`).join('. ');
    }
    container.querySelectorAll('button[data-step]').forEach(button=>button.addEventListener('click',()=>{
      const ids=button.dataset.target==='both'?data.series.map(s=>s.id):[button.dataset.target];
      ids.forEach(id=>shifts[id]=clampSteps(shifts[id]+Number(button.dataset.step)));render(true);
    }));
    container.querySelector('#reset-shifts').addEventListener('click',()=>{data.series.forEach(s=>shifts[s.id]=0);render(true);});
    api.getState=()=>({shifts:{...shifts},domain:domain(data.series,shifts)});
    api.data=data;
    render();
    let lastWidth=container.clientWidth;
    const observer=new ResizeObserver(()=>{if(container.clientWidth!==lastWidth){lastWidth=container.clientWidth;render();}});observer.observe(container);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})(typeof window!=='undefined'?window:globalThis);

</script>
